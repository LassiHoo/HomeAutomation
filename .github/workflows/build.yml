name: Build

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libsqlite3-dev pkg-config \
            git ca-certificates autoconf autoconf-archive automake libtool libtool-bin

      # GitHub's ubuntu-latest runner (like Ubuntu 22.04/24.04 generally)
      # only ships libgpiod v1 via apt; this project is written against the
      # v2 C++ API, so it's built from source here too (same as the
      # Dockerfile's builder stage — see its top-of-file comment for why).
      - name: Build libgpiod v2 from source
        run: |
          git clone --branch v2.2.4 --depth 1 https://github.com/brgl/libgpiod.git /tmp/libgpiod
          cd /tmp/libgpiod
          ./autogen.sh --enable-bindings-cxx --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/arm64 image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: home-automation-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
