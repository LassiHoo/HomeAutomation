services:
  hub:
    image: ghcr.io/OWNER/home-automation-hub:latest
    build: .
    container_name: home_automation_hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
    volumes:
      - hub_data:/app/data
      - hub_logs:/app/logs
    environment:
      HUB_PORT: "8080"

volumes:
  hub_data:
  hub_logs:
